name: Deploy to AWS Lambda

on:
  push:
    branches:
      - main        # auto-deploys every time you push to main branch

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Pull your code
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Set up Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Step 3: Install dependencies
      - name: Install dependencies
        run: pip install requests beautifulsoup4 -t .

      # Step 4: Set up AWS credentials from GitHub Secrets
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      # Step 5: Install SAM CLI
      - name: Install SAM CLI
        run: pip install aws-sam-cli

      # Step 6: Build
      - name: SAM Build
        run: sam build

      # Step 7: Deploy
      - name: SAM Deploy
        run: |
          sam deploy \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --stack-name price-checker \
            --region ap-south-1 \
            --capabilities CAPABILITY_IAM \
            --parameter-overrides \
              NotifyEmail=${{ secrets.NOTIFY_EMAIL }} \
              SenderEmail=${{ secrets.SENDER_EMAIL }} \
              TargetPrice=${{ secrets.TARGET_PRICE }}
