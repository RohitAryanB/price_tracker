AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31

Description: >
  Book price checker with API Gateway frontend, hourly cron, and SES email alerts.

Globals:
  Function:
    Runtime: python3.12
    Timeout: 30
    MemorySize: 128

Parameters:
  SenderEmail:
    Type: String
    Description: "SES-verified sender email address"

Resources:

  PriceCheckerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: BookPriceChecker
      Handler: lambda_function.lambda_handler
      CodeUri: .
      Description: "Scrapes book price and emails alert on price drop"
      Environment:
        Variables:
          SENDER_EMAIL: !Ref SenderEmail
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - ses:SendEmail
                - ses:SendRawEmail
              Resource: "*"
      Events:
        ApiPost:
          Type: Api
          Properties:
            RestApiId: !Ref PriceCheckerApi
            Path: /check
            Method: POST
        ApiOptions:
          Type: Api
          Properties:
            RestApiId: !Ref PriceCheckerApi
            Path: /check
            Method: OPTIONS
        HourlySchedule:
          Type: Schedule
          Properties:
            Name: BookPriceCheckerSchedule
            Schedule: rate(1 hour)
            Description: "Triggers price check every hour"
            Enabled: false   # enable once you have active trackers in a DB

  PriceCheckerApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: PriceCheckerApi
      StageName: prod
      Cors:
        AllowMethods: "'POST,OPTIONS'"
        AllowHeaders: "'Content-Type'"
        AllowOrigin: "'*'"

Outputs:
  ApiUrl:
    Description: "API Gateway endpoint — paste this into index.html"
    Value: !Sub "https://${PriceCheckerApi}.execute-api.${AWS::Region}.amazonaws.com/prod/check"
  FunctionArn:
    Description: "Lambda function ARN"
    Value: !GetAtt PriceCheckerFunction.Arn
