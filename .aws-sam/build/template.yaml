AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: "Book price checker \u2014 runs every hour via EventBridge and sends\
  \ an SES email alert when the price drops below the target.\n"
Globals:
  Function:
    Runtime: python3.12
    Timeout: 30
    MemorySize: 128
Parameters:
  NotifyEmail:
    Type: String
    Description: Recipient email address for price-drop alerts
  SenderEmail:
    Type: String
    Description: SES-verified sender email address
  TargetPrice:
    Type: String
    Default: '60'
    Description: Alert when price drops at or below this value (GBP)
Resources:
  PriceCheckerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: BookPriceChecker
      Handler: lambda_function.lambda_handler
      CodeUri: PriceCheckerFunction
      Description: Scrapes book price and emails an alert on price drop
      Environment:
        Variables:
          TARGET_PRICE:
            Ref: TargetPrice
          NOTIFY_EMAIL:
            Ref: NotifyEmail
          SENDER_EMAIL:
            Ref: SenderEmail
      Policies:
      - Statement:
        - Effect: Allow
          Action:
          - ses:SendEmail
          - ses:SendRawEmail
          Resource: '*'
      Events:
        HourlySchedule:
          Type: Schedule
          Properties:
            Name: BookPriceCheckerSchedule
            Schedule: rate(1 hour)
            Description: Triggers price check every hour
            Enabled: true
    Metadata:
      SamResourceId: PriceCheckerFunction
Outputs:
  FunctionArn:
    Description: Lambda function ARN
    Value:
      Fn::GetAtt:
      - PriceCheckerFunction
      - Arn
  ScheduleRule:
    Description: EventBridge rule that triggers the function
    Value: BookPriceCheckerSchedule
